document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; }\n\n  /* Callout (replaces amber note) */\n  .callout { background: var(--callout-bg); border: 1px solid var(--callout-bd); border-left: 3px solid var(--blue); color: var(--callout-tx); border-radius: var(--radius-sm); padding: 13px 18px; font-size: clamp(12.5px,1.3vw,14px); line-height: 1.55; }\n\n  /* Example block */\n  .example { border-radius: var(--radius); background: linear-gradient(180deg, #f9fbff, #eef4fe); border: 1px solid var(--blue-line); padding: clamp(15px, 1.9vw, 22px); }\n  .example .tag { display:inline-flex; align-items:center; gap:8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--blue); margin-bottom: 8px; }\n  .example p { font-size: clamp(13px, 1.45vw, 16px); color: #1e3a8a; }\n\n  /* Stats */\n  .stat { display:flex; flex-direction:column; gap:4px; }\n  .stat .v { font-size: clamp(24px,3vw,36px); font-weight:700; color: var(--ink); letter-spacing: -.02em; line-height: 1; }\n  .stat .l { font-size: 11.5px; text-transform: uppercase; letter-spacing:.08em; color: var(--muted); font-weight:700; line-height: 1.35; }\n  .feature .stat .v { color:#fff; } .feature .stat .l { color: var(--blue-2); }\n\n  /* Figures */\n  figure { display: flex; flex-direction: column; }\n  .fig { border-radius: var(--radius); overflow: hidden; background: linear-gradient(135deg, var(--navy), var(--blue)); border: 1px solid var(--line); aspect-ratio: 16 / 11; position: relative; }\n  .fig.tall { aspect-ratio: 4 / 5; }\n  .fig img { width: 100%; height: 100%; object-fit: cover; display: block; }\n  .fig .fb { position: absolute; inset: 0; display: none; align-items: flex-end; padding: 16px; color: #dbe6fb; font-size: 12px; font-weight: 600; letter-spacing: .04em; background: linear-gradient(135deg, var(--navy), var(--blue)); }\n  .fig.failed .fb { display: flex; }\n  figc \">Guía de transformación digital<\u002Fdiv>\n          <h1>Transformación Digital en <span class=\"hl\">6 fases<\u002Fspan><\u002Fh1>\n          <div class=\"accent\"><\u002Fdiv>\n          <p class=\"lead\">Un método ordenado para leer la madurez de una entidad pública, priorizar brechas y activar mejoras medibles en procesos, datos y servicio al ciudadano.<\u002Fp>\n          <div class=\"pill-row\" style=\"margin-top:6px;\">\n            <span class=\"pill\">Diagnóstico MD-IA<\u002Fspan>\n            <span class=\"pill\">Procesos &amp; datos<\u002Fspan>\n            <span class=\"pill\">Uso cuidadoso de IA<\u002Fspan>\n            <span class=\"pill\">Servicio al ciudadano<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"meta\" style=\"margin-top:8px;\">AlgoritmoT · Empresas · algoritmot.com<\u002Fdiv>\n        <\u002Fdiv>\n        <figure class=\"fig\">\n          <img src=\"901bfa96-dbda-4068-8927-9bd8092996d3\" alt=\"Equipo diverso colaborando con tecnología — transformación digital con sentido humano\" loading=\"lazy\" onerror=\"this.closest('.fig').classList.add('failed')\" data-comment-anchor=\"860c59b0b8-img\">\n          <div class=\"fb\">Personas + tecnología<\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · ÍNDICE -->\n  <section class=\"slide\" data-screen-label=\"02 · Índice\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"kicker\">Contenido<\u002Fdiv><h2>Índice<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">01<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"toc\">\n        <button onclick=\"goTo(3)\"><span class=\"n\">01<\u002Fspan><span><span class=\"tt\">¿Qué es la transformación digital?<\u002Fspan><br><span class=\"ts\">Enfoque estratégico para lo público<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(4)\"><span class=\"n\">02<\u002Fspan><span><span class=\"tt\">Marco MD-IA y sus 6 dimensiones<\u002Fspan><br><span class=\"ts\">DQ, AIQ y tabla de dimensiones<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(5)\"><span class=\"n\">03<\u002Fspan><span><span class=\"tt\">De la lectura inicial a la mejora continua<\u002Fspan><br><span class=\"ts\">La ruta de transformación<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(6)\"><span class=\"n\">04<\u002Fspan><span><span class=\"tt\">Tabla resumen de las 6 fases<\u002Fspan><br><span class=\"ts\">Qué se hace · entregable · ejemplo<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(7)\"><span class=\"n\">F1<\u002Fspan><span><span class=\"tt\">Captura del ADN Digital<\u002Fspan><br><span class=\"ts\">Diagnóstico + radar de madurez<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(8)\"><span class=\"n\">F2<\u002Fspan><span><span class=\"tt\">Mapeo de Procesos<\u002Fspan><br><span class=\"ts\">BPMN as-is → to-be<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(9)\"><span class=\"n\">F3<\u002Fspan><span><span class=\"tt\">Humano vs. Tecnología<\u002Fspan><br><span class=\"ts\">Matriz de decisión<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(10)\"><span class=\"n\">F4<\u002Fspan><span><span class=\"tt\">Diseño y Desarrollo<\u002Fspan><br><span class=\"ts\">Arquitectura en capas<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(11)\"><span class=\"n\">F5<\u002Fspan><span><span class=\"tt\">Implementación<\u002Fspan><br><span class=\"ts\">Cronograma de 12 semanas<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(12)\"><span class=\"n\">F6<\u002Fspan><span><span class=\"tt\">Mejora Continua<\u002Fspan><br><span class=\"ts\">Ciclo PDCA<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(13)\"><span class=\"n\">05<\u002Fspan><span><span class=\"tt\">Hoja de ruta por horizontes<\u002Fspan><br><span class=\"ts\">H1 · H2 · H3<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button onclick=\"goTo(14)\"><span class=\"n\">06<\u002Fspan><span><span class=\"tt\">Caso integrador<\u002Fspan><br><span class=\"ts\">Una alcaldía, de extremo a extremo<\u002Fspan><\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · QUÉ ES -->\n  <section class=\"slide\" data-screen-label=\"03 · Qué es\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"kicker\">Punto de partida<\u002Fdiv><h2>¿Qué es la transformación digital?<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">01<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"col-7-5 grow\">\n        <div class=\"stack\">\n          <p class=\"lead\">La transformación digital es una forma ordenada de leer la madurez de una entidad, priorizar sus brechas y activar mejoras en procesos, datos, tecnología, liderazgo y servicio al ciudadano. Su valor está en convertir el <strong>diagnóstico<\u002Fstrong> en una hoja de ruta concreta, medible y útil para la gestión pública.<\u002Fp>\n          <div class=\"grid2\">\n            <div class=\"panel\"><h3>Por qué importa en lo público<\u002Fh3><ul class=\"dot\" style=\"margin-top:14px;\">\n              <li>Más valor por cada peso público invertido.<\u002Fli>\n              <li>Trámites más rápidos y trazables.<\u002Fli>\n              <li>Decisiones basadas en datos.<\u002Fli>\n              <li>Transparencia y rendición de cuentas.<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n            <div class=\"feature\"><h3>Cómo trabajamos<\u002Fh3><ul class=\"dot\" style=\"margin-top:14px;\">\n              <li data-comment-anchor=\"74996bc3ee-li\">Escuchamos el contexto y las metas.<\u002Fli>\n              <li>Definimos prioridades de alto impacto.<\u002Fli>\n              <li>Acompañamos la puesta en marcha con los equipos responsables.<\u002Fli>\n              <li>Seguimos los indicadores y ajustamos el proceso.<\u002Fli>\n            <\u002Ful><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figure class=\"center-y\">\n          <div class=\"fig tall\"><img src=\"a2bbfad8-65f5-467d-95c6-b6c61c3c57b5\" alt=\"Equipo de trabajo colaborando con foco en las personas\" loading=\"lazy\" onerror=\"this.closest('.fig').classList.add('failed')\" data-comment-anchor=\"5eb36d6553-img\"><div class=\"fb\">Gestión centrada en las personas<\u002Fdiv><\u002Fdiv>\n          <figcaption>Modernización de la gestión con foco en las personas.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · MARCO MD-IA + TABLA -->\n  <section class=\"slide\" data-screen-label=\"04 · Marco MD-IA\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"kicker\">Marco metodológico<\u002Fdiv><h2>Madurez Digital &amp; IA (MD-IA)<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">02<\u002Fdiv>\n      <\u002Fheader>\n      <p class=\"lead\" style=\"max-width:74ch; margin-bottom:20px;\">Integramos marcos reconocidos —McKinsey (DQ/AIQ), Capgemini/MIT y Deloitte— en un modelo propio de <strong>seis dimensiones<\u002Fstrong>, escala 0–100.<\u002Fp>\n      <div class=\"tbl-wrap\">\n        <table class=\"tbl\">\n          <thead><tr><th style=\"width:22%;\">Dimensión<\u002Fth><th>Qué mide<\u002Fth><th style=\"width:30%;\">Señal típica en lo público<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Estrategia<\u002Ftd><td>Visión y alineación de lo digital/IA con el plan de gobierno.<\u002Ftd><td>Plan de TI desactualizado o sin hoja de ruta.<\u002Ftd><\u002Ftr>\n            <tr><td>Infraestructura &amp; Datos<\u002Ftd><td>Nube, ciberseguridad, calidad e integración de datos.<\u002Ftd><td>Datos en silos entre secretarías.<\u002Ftd><\u002Ftr>\n            <tr><td>Talento &amp; Cultura<\u002Ftd><td>Habilidades digitales y apertura al cambio.<\u002Ftd><td>Dependencia de pocas personas clave.<\u002Ftd><\u002Ftr>\n            <tr><td>Gobernanza &amp; Liderazgo<\u002Ftd><td>Estructura, comités y decisiones basadas en datos.<\u002Ftd><td>Sin comité digital ni responsable de datos.<\u002Ftd><\u002Ftr>\n            <tr><td>Procesos &amp; Automatización<\u002Ftd><td>Eficiencia operativa y flujos inteligentes.<\u002Ftd><td>Trámites manuales y en papel.<\u002Ftd><\u002Ftr>\n            <tr><td>Experiencia del ciudadano<\u002Ftd><td>Canales digitales y atención omnicanal.<\u002Ftd><td>Atención solo presencial, sin trazabilidad.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"grid3\" style=\"margin-top:18px;\">\n        <div class=\"feature\"><div class=\"grid2\"><div class=\"stat\"><span class=\"v\">DQ<\u002Fspan><span class=\"l\">Digital Quotient · promedio<\u002Fspan><\u002Fdiv><div class=\"stat\"><span class=\"v\">AIQ<\u002Fspan><span class=\"l\">AI Quotient · ponderado<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\"><div class=\"stat\"><span class=\"v\" style=\"color:#dc2626;\">0–33<\u002Fspan><span class=\"l\">Nivel bajo<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\"><div class=\"grid2\"><div class=\"stat\"><span class=\"v\" style=\"color:#d97706;\">34–66<\u002Fspan><span class=\"l\">Intermedio<\u002Fspan><\u002Fdiv><div class=\"stat\"><span class=\"v\" style=\"color:#059669;\">67–100<\u002Fspan><span class=\"l\">Alto<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · LAS 6 FASES + PIPELINE -->\n  <section class=\"slide\" data-screen-label=\"05 · Ruta de fases\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"kicker\">Ruta<\u002Fdiv><h2>De la lectura inicial a la mejora continua<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">03<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"svg-wrap\" style=\"margin-bottom:20px;\">\n        <svg viewBox=\"0 0 1180 150\" role=\"img\" aria-label=\"Cadena de las 6 fases\">\n          <defs><marker i  fill=\"#2f6fe6\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">FASE 3<\u002Ftext><text x=\"490\" y=\"86\" fill=\"#0f172a\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">Humano vs IA<\u002Ftext><text x=\"490\" y=\"104\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"middle\">Uso cuidadoso de IA<\u002Ftext><\u002Fg>\n            <g><rect x=\"595\" y=\"30\" width=\"180\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#e2e8f0\"><\u002Frect><text x=\"685\" y=\"62\" fill=\"#2f6fe6\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">FASE 4<\u002Ftext><text x=\"685\" y=\"86\" fill=\"#0f172a\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">Desarrollo<\u002Ftext><text x=\"685\" y=\"104\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"middle\">Soluciones<\u002Ftext><\u002Fg>\n            <g><rect x=\"790\" y=\"30\" width=\"180\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#e2e8f0\"><\u002Frect><text x=\"880\" y=\"62\" fill=\"#2f6fe6\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">FASE 5<\u002Ftext><text x=\"880\" y=\"86\" fill=\"#0f172a\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">Implementación<\u002Ftext><text x=\"880\" y=\"104\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"middle\">Despliegue<\u002Ftext><\u002Fg>\n            <g><rect x=\"985\" y=\"30\" width=\"185\" height=\"90\" rx=\"14\" fill=\"#16235c\"><\u002Frect><text x=\"1077\" y=\"62\" fill=\"#7fa6f6\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">FASE 6<\u002Ftext><text x=\"1077\" y=\"86\" fill=\"#fff\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">Mejora Continua<\u002Ftext><text x=\"1077\" y=\"104\" fill=\"#c7d4f0\" font-size=\"11\" text-anchor=\"middle\">PDCA<\u002Ftext><\u002Fg>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <p class=\"lead muted\" style=\"max-width:90ch;\">Cada fase alimenta a la siguiente: el diagnóstico ordena prioridades; el mapeo y la decisión humano-tecnología definen el alcance; y el desarrollo, la implementación y la mejora continua lo llevan a la operación real.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6 · TABLA RESUMEN -->\n  <section class=\"slide\" data-screen-label=\"06 · Tabla resumen\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"kicker\">Síntesis<\u002Fdiv><h2>Tabla resumen de las 6 fases<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">04<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"tbl-wrap\">\n        <table class=\"tbl\">\n          <thead><tr><th style=\"width:16%;\">Fase<\u002Fth><th style=\"width:30%;\">Qué se hace<\u002Fth><th style=\"width:26%;\">Entregable clave<\u002Fth><th>Ejemplo · sector público<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>1 · ADN Digital<\u002Ftd><td>Diagnóstico de madurez (MD-IA) y roadmap.<\u002Ftd><td>Radar DQ/AIQ + roadmap priorizado.<\u002Ftd><td>Diagnóstico de Hacienda y Gobierno municipal.<\u002Ftd><\u002Ftr>\n            <tr><td>2 · Mapeo<\u002Ftd><td>BPMN as-is → to-be y Lean.<\u002Ftd><td>Diagramas y matriz de KPIs.<\u002Ftd><td>Rediseño de PQRS y licencias de construcción.<\u002Ftd><\u002Ftr>\n            <tr><td>3 · Humano vs. IA<\u002Ftd><td>Qué automatizar con criterio responsable.<\u002Ftd><td>Matriz humano/tecnología + gobernanza.<\u002Ftd><td>Enrutamiento de solicitudes; casos sensibles a humano.<\u002Ftd><\u002Ftr>\n            <tr><td>4 · Desarrollo<\u002Ftd><td>Solución a medida en sprints ágiles.<\u002Ftd><td>Plataforma + integraciones.<\u002Ftd><td>Ventanilla única de trámites en línea.<\u002Ftd><\u002Ftr>\n            <tr><td>5 · Implementación<\u002Ftd><td>Migración, capacitación y go-live.<\u002Ftd><td>Plan de 12 semanas + UAT.<\u002Ftd><td>Despliegue con gestión del cambio en secretarías.<\u002Ftd><\u002Ftr>\n            <tr><td>6 · Mejora Continua<\u002Ftd><td>Ciclo PDCA y monitoreo de KPIs.<\u002Ftd><td>Dashboard + informe mensual.<\u002Ftd><td>Tablero de servicio al ciudadano con SLAs.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"callout\" style=\"margin-top:18px;\">Los montos y puntajes del simulador en línea son estimaciones de referencia; el diagnóstico real se realiza con encuestas, entrevistas y análisis de datos vs. benchmarks del sector.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 · FASE 1 + RADAR -->\n  <section class=\"slide\" data-screen-label=\"F1 · ADN Digital\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"ptag\"><b>F1<\u002Fb> Fase 1 · Diagnóstico estratégico<\u002Fdiv><h2 style=\"margin-top:14px;\">Captura del ADN Digital<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">F1<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"col-7-5\">\n        <div class=\"stack\">\n          <div class=\"panel\"><h3>¿Qué se hace y cómo?<\u002Fh3>\n            <p style=\"margin-top:12px;\">Diagnóstico 360° de la entidad: modelo de operación (Business Model Canvas), propuesta de valor pública (Value Proposition Canvas) y evaluación de madurez (MD-IA) con encuestas, entrevistas y datos. Resultado: roadmap priorizado.<\u002Fp>\n            <div class=\"chiprow\" style=\"margin-top:14px;\"><span class=\"chip\">Business Model Canvas<\u002Fspan><span class=\"chip\">Value Proposition<\u002Fspan><span class=\"chip\">Evaluación MD-IA<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"panel\"><h3>Productos / entregables<\u002Fh3><ul class=\"clean\" style=\"margin-top:12px;\">\n            <li>Radar de madurez en 6 dimensiones (DQ y AIQ).<\u002Fli>\n            <li>Roadmap priorizado (90 días y 12 meses).<\u002Fli>\n            <li>Quick wins con impacto estimado.<\u002Fli>\n            <li>Informe ejecutivo para concejo / dirección.<\u002Fli>\n          <\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"svg-wrap\">\n          <div class=\"svg-label\">Radar de madurez · ejemplo<\u002Fdiv>\n          <svg viewBox=\"0 0 340 300\" role=\"img\" aria-label=\"Radar de madurez de ejemplo\">\n            <g stroke=\"#e2e8f0\" fill=\"none\" stroke-width=\"1\">\n              <polygon points=\"170,40 265.3,95 265.3,205 170,260 74.7,205 74.7,95\"><\u002Fpolygon>\n              <polygon points=\"170,77.4 232.9,113.7 232.9,186.3 170,222.6 107.1,186.3 107.1,113.7\"><\u002Fpolygon>\n              <polygon points=\"170,113.7 201.4,131.85 201.4,168.15 170,186.3 138.6,168.15 138.6,131.85\"><\u002Fpolygon>\n            <\u002Fg>\n            <g stroke=\"#cbd5e1\" stroke-width=\"1\">\n              <line x1=\"170\" y1=\"150\" x2=\"170\" y2=\"40\"><\u002Fline><line x1=\"170\" y1=\"150\" x2=\"265.3\" y2=\"95\"><\u002Fline><line x1=\"170\" y1=\"150\" x2=\"265.3\" y2=\"205\"><\u002Fline>\n              <line x1=\"170\" y1=\"150\" x2=\"170\" y2=\"260\"><\u002Fline><line x1=\"170\" y1=\"150\" x2=\"74.7\" y2=\"205\"><\u002Fline><line x1=\"170\" y1=\"150\" x2=\"74.7\" y2=\"95\"><\u002Fline>\n            <\u002Fg>\n            <polygon points=\"170,70.8 241.5,108.75 234.8,187.4 170,227 107.1,186.3 102.4,110.95\" fill=\"#94a3b8\" fill-opacity=\"0.18\" stroke=\"#94a3b8\" stroke-width=\"2\"><\u002Fpolygon>\n            <polygon points=\"170,128 203.3,130.75 189,161 170,178.6 147.1,163.2 139.5,132.4\" fill=\"#2f6fe6\" fill-opacity=\"0.32\" stroke=\"#2f6fe6\" stroke-width=\"2.5\"><\u002Fpolygon>\n            <g font-family=\"Space Grotesk, sans-serif\" font-size=\"11\" fill=\"#475569\" font-weight=\"700\">\n              <text x=\"170\" y=\"30\" text-anchor=\"middle\">Estrategia<\u002Ftext>\n              <text x=\"272\" y=\"92\" text-anchor=\"start\">Infraestructura<\u002Ftext>\n              <text x=\"272\" y=\"212\" text-anchor=\"start\">Talento<\u002Ftext>\n              <text x=\"170\" y=\"278\" text-anchor=\"middle\">Gobernanza<\u002Ftext>\n              <text x=\"68\" y=\"212\" text-anchor=\"end\">Procesos<\u002Ftext>\n              <text x=\"68\" y=\"92\" text-anchor=\"end\">Experiencia<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n          <div class=\"legend\"><span style=\"color:#2f6fe6;\">■ Tu entidad<\u002Fspan><span style=\"color:#94a3b8;\">■ Benchmark<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"example\" style=\"margin-top:18px;\"><span class=\"tag\">▮ Ejemplo · Sector público<\u002Fspan><p><strong>Alcaldía municipal.<\u002Fstrong> El radar revela Estrategia y Gobernanza en nivel bajo y datos fragmentados. El quick win priorizado: un tablero de indicadores de recaudo y un inventario de trámites para digitalizar primero los de mayor volumen ciudadano.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · FASE 2 + BPMN -->\n  <section class=\"slide\" data-screen-label=\"F2 · Mapeo BPMN\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"ptag\"><b>F2<\u002Fb> Fase 2 · Optimización digital<\u002Fdiv><h2 style=\"margin-top:14px;\">Mapeo de Procesos (BPMN)<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">F2<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"svg-wrap\" style=\"margin-bottom:16px;\">\n        <svg viewBox=\"0 0 1180 230\" role=\"img\" aria-label=\"Rediseño de proceso as-is a to-be\">\n          <defs><marker id=\"ar2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#94a3b8\"><\u002Fpath><\u002Fmarker><marker id=\"ar3\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2f6fe6\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n          <g font-family=\"Space Grotesk, sans-serif\" font-size=\"13\" font-weight=\"700\">\n            <text x=\"10\" y=\"26\" fill=\"#b91c1c\" font-size=\"12\" letter-spacing=\"1\">AS-IS · HOY (con desperdicios)<\u002Ftext>\n            <g fill=\"#fef2f2\" stroke=\"#fecaca\">\n              <rect x=\"10\" y=\"40\" width=\"200\" height=\"56\" rx=\"10\"><\u002Frect><rect x=\"270\" y=\"40\" width=\"200\" height=\"56\" rx=\"10\"><\u002Frect><rect x=\"530\" y=\"40\" width=\"200\" height=\"56\" rx=\"10\"><\u002Frect><rect x=\"790\" y=\"40\" width=\"220\" height=\"56\" rx=\"10\"><\u002Frect>\n            <\u002Fg>\n            <g fill=\"#7f1d1d\" text-anchor=\"middle\" font-size=\"12.5\">\n              <text x=\"110\" y=\"73\">Radicación en papel<\u002Ftext><text x=\"370\" y=\"73\">Asignación manual<\u002Ftext><text x=\"630\" y=\"73\">Respuesta dispersa<\u002Ftext><text x=\"900\" y=\"73\">Sin trazabilidad<\u002Ftext>\n            <\u002Fg>\n            <g stroke=\"#94a3b8\" stroke-width=\"2\"><line x1=\"210\" y1=\"68\" x2=\"265\" y2=\"68\" marker-end=\"url(#ar2)\"><\u002Fline><line x1=\"470\" y1=\"68\" x2=\"525\" y2=\"68\" marker-end=\"url(#ar2)\"><\u002Fline><line x1=\"730\" y1=\"68\" x2=\"785\" y2=\"68\" marker-end=\"url(#ar2)\"><\u002Fline><\u002Fg>\n            <text x=\"10\" y=\"150\" fill=\"#15803d\" font-size=\"12\" letter-spacing=\"1\">TO-BE · OPTIMIZADO<\u002Ftext>\n            <g fill=\"#eff6ff\" stroke=\"#bfdbfe\">\n              <rect x=\"10\" y=\"164\" width=\"200\" height=\"56\" rx=\"10\"><\u002Frect><rect x=\"270\" y=\"164\" width=\"200\" height=\"56\" rx=\"10\"><\u002Frect><rect x=\"530\" y=\"164\" width=\"200\" height=\"56\" rx=\"10\"><\u002Frect><rect x=\"790\" y=\"164\" width=\"220\" height=\"56\" rx=\"10\"><\u002Frect>\n            <\u002Fg>\n            <g fill=\"#1e3a8a\" text-anchor=\"middle\" font-size=\"12.5\">\n              <text x=\"110\" y=\"197\">Ventanilla única<\u002Ftext><text x=\"370\" y=\"197\">Asignación automática<\u002Ftext><text x=\"630\" y=\"197\">Respuesta guiada<\u002Ftext><text x=\"900\" y=\"197\">Trazabilidad clara<\u002Ftext>\n            <\u002Fg>\n            <g stroke=\"#2f6fe6\" stroke-width=\"2\"><line x1=\"210\" y1=\"192\" x2=\"265\" y2=\"192\" marker-end=\"url(#ar3)\"><\u002Fline><line x1=\"470\" y1=\"192\" x2=\"525\" y2=\"192\" marker-end=\"url(#ar3)\"><\u002Fline><line x1=\"730\" y1=\"192\" x2=\"785\" y2=\"192\" marker-end=\"url(#ar3)\"><\u002Fline><\u002Fg>\n            <text x=\"1075\" y=\"120\" fill=\"#2f6fe6\" font-size=\"13\" text-anchor=\"middle\">▼ rediseño<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"grid2 grow\">\n        <div class=\"panel\"><h3>¿Qué se hace y cómo?<\u002Fh3><p style=\"margin-top:12px;\">Se hacen visibles los procesos con BPMN 2.x, se identifican desperdicios con Value Stream Mapping (Lean) y se rediseñan de as-is a to-be. El alcance depende del número de procesos a mapear.<\u002Fp><\u002Fdiv>\n        <div class=\"panel\"><h3>Productos / entregables<\u002Fh3><ul class=\"clean\" style=\"margin-top:12px;\"><li>Diagramas as-is y to-be de procesos clave.<\u002Fli><li>Mapa de desperdicios y actividades sin valor.<\u002Fli><li>Matriz de KPIs por proceso y responsable.<\u002Fli><li>Hoja de ruta de automatización priorizada.<\u002Fli><\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"example\" style=\"margin-top:16px;\"><span class=\"tag\">▮ Ejemplo · Sector público<\u002Fspan><p><strong>Atención de PQRS y licencias de construcción.<\u002Fstrong> Del flujo en papel con asignación por correo a una ventanilla única con enrutamiento automático y trazabilidad, cumpliendo los tiempos de ley.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9 · FASE 3 + MATRIZ -->\n  <section class=\"slide\" data-screen-label=\"F3 · Humano vs IA\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"ptag\"><b>F3<\u002Fb> Fase 3 · Uso cuidadoso de IA<\u002Fdiv><h2 style=\"margin-top:14px;\">Humano vs. Tecnología<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">F3<\u002Fdiv>\n      <\u002Fheader>\n      <p class=\"lead\" style=\"max-width:74ch; margin-bottom:16px;\">Con criterio objetivo y marcos de uso responsable de IA (NIST AI RMF, ISO 9241) decidimos qué tarea es humana, cuál se automatiza y cuál se trabaja en colaboración.<\u002Fp>\n      <div class=\"tbl-wrap\">\n        <table class=\"tbl\">\n          <thead><tr><th style=\"width:42%;\">Actividad (ejemplo público)<\u002Fth><th>Decisión<\u002Fth><th>Riesgo IA<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Clasificación y enrutamiento de PQRS<\u002Ftd><td>Automatizado<\u002Ftd><td><span class=\"lvl lv-bajo\">Bajo<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Casos sensibles (derechos, subsidios)<\u002Ftd><td>Humano<\u002Ftd><td><span class=\"lvl lv-alto\">Alto<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Generación de reportes periódicos<\u002Ftd><td>Automatizado<\u002Ftd><td><span class=\"lvl lv-bajo\">Bajo<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Análisis jurídico de expedientes<\u002Ftd><td>Colaboración humano-IA<\u002Ftd><td><span class=\"lvl lv-alto\">Alto<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Atención presencial en punto de servicio<\u002Ftd><td>Humano<\u002Ftd><td><span class=\"lvl lv-med\">Medio<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Detección de inconsistencias en pagos<\u002Ftd><td>Colaboración humano-IA<\u002Ftd><td><span class=\"lvl lv-med\">Medio<\u002Fspan><\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"example\" style=\"margin-top:16px;\"><span class=\"tag\">▮ Ejemplo · Sector público<\u002Fspan><p>La IA enruta automáticamente las solicitudes de bajo riesgo; los casos que afectan derechos quedan en manos de un funcionario, con criterios documentados y registro auditable para fortalecer criterios de equidad y debido proceso.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 · FASE 4 + ARQUITECTURA -->\n  <section class=\"slide\" data-screen-label=\"F4 · Desarrollo\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"ptag\"><b>F4<\u002Fb> Fase 4 · Soluciones a medida<\u002Fdiv><h2 style=\"margin-top:14px;\">Diseño y Desarrollo<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">F4<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"col-5-7\">\n        <div class=\"svg-wrap\">\n          <div class=\"svg-label\">Arquitectura en capas<\u002Fdiv>\n          <svg viewBox=\"0 0 520 280\" role=\"img\" aria-label=\"Arquitectura de la solución en capas\">\n            <g font-family=\"Space Grotesk, sans-serif\">\n              <g><rect x=\"10\" y=\"10\" width=\"500\" height=\"46\" rx=\"10\" fill=\"#eff6ff\" stroke=\"#bfdbfe\"><\u002Frect><text x=\"26\" y=\"32\" font-size=\"13\" font-weight=\"700\" fill=\"#1e3a8a\">Interfaz de usuario<\u002Ftext><text x=\"26\" y=\"48\" font-size=\"11\" fill=\"#3b82f6\">Interfaces claras, accesibles y adaptadas al usuario<\u002Ftext><\u002Fg>\n              <g><rect x=\"10\" y=\"64\" width=\"500\" height=\"46\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#e2e8f0\"><\u002Frect><text x=\"26\" y=\"86\" font-size=\"13\" font-weight=\"700\" fill=\"#0f172a\">Lógica de negocio<\u002Ftext><text x=\"26\" y=\"102\" font-size=\"11\" fill=\"#64748b\">Servicios conectados con los sistemas existentes<\u002Ftext><\u002Fg>\n              <g><rect x=\"10\" y=\"118\" width=\"500\" height=\"46\" rx=\"10\" fill=\"#16235c\"><\u002Frect><text x=\"26\" y=\"140\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">IA &amp; Automatización<\u002Ftext><text x=\"26\" y=\"156\" font-size=\"11\" fill=\"#9db8f4\">Automatización de tareas repetitivas y apoyo a decisiones<\u002Ftext><\u002Fg>\n              <g><rect x=\"10\" y=\"172\" width=\"500\" height=\"46\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#e2e8f0\"><\u002Frect><text x=\"26\" y=\"194\" font-size=\"13\" font-weight=\"700\" fill=\"#0f172a\">Datos &amp; persistencia<\u002Ftext><text x=\"26\" y=\"210\" font-size=\"11\" fill=\"#64748b\">Datos organizados, seguros y disponibles<\u002Ftext><\u002Fg>\n              <g><rect x=\"10\" y=\"226\" width=\"500\" height=\"46\" rx=\"10\" fill=\"#eff6ff\" stroke=\"#bfdbfe\"><\u002Frect><text x=\"26\" y=\"248\" font-size=\"13\" font-weight=\"700\" fill=\"#1e3a8a\">Integraciones<\u002Ftext><text x=\"26\" y=\"264\" font-size=\"11\" fill=\"#3b82f6\">Conexión con sistemas y plataformas del Estado<\u002Ftext><\u002Fg>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"stack\">\n          <div class=\"panel\"><h3>¿Qué se hace y cómo?<\u002Fh3><p style=\"margin-top:12px;\">Construcción a medida en sprints ágiles (Scrum), con versiones funcionales cada 2 semanas: de prototipos validados a plataformas cloud escalables e integradas. El alcance depende del número de soluciones y su complejidad.<\u002Fp><\u002Fdiv>\n          <div class=\"panel\"><h3>Productos / entregables<\u002Fh3><ul class=\"clean\" style=\"margin-top:12px;\"><li>Prototipo validado con ciudadanos reales.<\u002Fli><li>Integraciones con sistemas vigentes.<\u002Fli><li>Tablero de seguimiento del proyecto.<\u002Fli><li>Código documentado, probado y capacitación.<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"example\" style=\"margin-top:18px;\"><span class=\"tag\">▮ Ejemplo · Sector público<\u002Fspan><p><strong>Ventanilla única de trámites.<\u002Fstrong> El ciudadano radica, paga y hace seguimiento desde el celular, con notificaciones y firma digital, integrada al recaudo y a la plataforma de interoperabilidad del Estado.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 · FASE 5 + CRONOGRAMA -->\n  <section class=\"slide\" data-screen-label=\"F5 · Implementación\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"ptag\"><b>F5<\u002Fb> Fase 5 · Transformación real<\u002Fdiv><h2 style=\"margin-top:14px;\">Implementación<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">F5<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"svg-wrap\" style=\"margin-bottom:16px;\">\n        <div class=\"svg-label\">Cronograma de 12 semanas<\u002Fdiv>\n        <svg viewBox=\"0 0 1180 210\" role=\"img\" aria-label=\"Cronograma de implementación en 12 semanas\">\n          <g font-family=\"Space Grotesk, sans-serif\" font-size=\"12\">\n            <g stroke=\"#e2e8f0\"><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"190\"><\u002Fline><line x1=\"320\" y1=\"20\" x2=\"320\" y2=\"190\"><\u002Fline><line x1=\"490\" y1=\"20\" x2=\"490\" y2=\"190\"><\u002Fline><line x1=\"660\" y1=\"20\" x2=\"660\" y2=\"190\"><\u002Fline><line x1=\"830\" y1=\"20\" x2=\"830\" y2=\"190\"><\u002Fline><line x1=\"1000\" y1=\"20\" x2=\"1000\" y2=\"190\"><\u002Fline><\u002Fg>\n            <g fill=\"#94a3b8\" font-size=\"11\"><text x=\"150\" y=\"16\">Sem 2<\u002Ftext><text x=\"320\" y=\"16\">Sem 4<\u002Ftext><text x=\"490\" y=\"16\">Sem 6<\u002Ftext><text x=\"660\" y=\"16\">Sem 8<\u002Ftext><text x=\"830\" y=\"16\">Sem 10<\u002Ftext><text x=\"995\" y=\"16\">Sem 12<\u002Ftext><\u002Fg>\n            <g>\n              <rect x=\"20\" y=\"28\" width=\"300\" height=\"22\" rx=\"6\" fill=\"#16235c\"><\u002Frect><text x=\"30\" y=\"44\" fill=\"#fff\" font-weight=\"700\">Configuración &amp; setup<\u002Ftext>\n              <rect x=\"190\" y=\"56\" width=\"300\" height=\"22\" rx=\"6\" fill=\"#2f6fe6\"><\u002Frect><text x=\"200\" y=\"72\" fill=\"#fff\" font-weight=\"700\">Migración de datos<\u002Ftext>\n              <rect x=\"360\" y=\"84\" width=\"300\" height=\"22\" rx=\"6\" fill=\"#16235c\"><\u002Frect><text x=\"370\" y=\"100\" fill=\"#fff\" font-weight=\"700\">Capacitación por rol<\u002Ftext>\n              <rect x=\"530\" y=\"112\" width=\"300\" height=\"22\" rx=\"6\" fill=\"#2f6fe6\"><\u002Frect><text x=\"540\" y=\"128\" fill=\"#fff\" font-weight=\"700\">Pruebas &amp; UAT<\u002Ftext>\n              <rect x=\"700\" y=\"140\" width=\"160\" height=\"22\" rx=\"6\" fill=\"#16235c\"><\u002Frect><text x=\"710\" y=\"156\" fill=\"#fff\" font-weight=\"700\">Go-live<\u002Ftext>\n              <rect x=\"860\" y=\"168\" width=\"300\" height=\"22\" rx=\"6\" fill=\"#2f6fe6\"><\u002Frect><text x=\"870\" y=\"184\" fill=\"#fff\" font-weight=\"700\">Estabilización<\u002Ftext>\n            <\u002Fg>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"grid2 grow\">\n        <div class=\"panel\"><h3>¿Qué se hace y cómo?<\u002Fh3><p style=\"margin-top:12px;\">Plan por etapas con gestión del cambio (modelo de Kotter) para lograr adopción real entre los funcionarios. Un buen software fracasa si la implementación no se gestiona.<\u002Fp><\u002Fdiv>\n        <div class=\"panel\"><h3>Productos / entregables<\u002Fh3><ul class=\"clean\" style=\"margin-top:12px;\"><li>Plan de migración con validación de integridad.<\u002Fli><li>Capacitación por rol (presencial/virtual).<\u002Fli><li>Pruebas UAT aprobadas por usuarios clave.<\u002Fli><li>Soporte intensivo en las primeras semanas.<\u002Fli><\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"example\" style=\"margin-top:16px;\"><span class=\"tag\">▮ Ejemplo · Sector público<\u002Fspan><p><strong>Despliegue de la ventanilla única.<\u002Fstrong> Migración del histórico, capacitación a las secretarías, go-live controlado y puntos de atención asistida para mantener apoyo a ciudadanos con menor acceso digital.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12 · FASE 6 + PDCA -->\n  <section class=\"slide\" data-screen-label=\"F6 · Mejora Continua\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"ptag\"><b>F6<\u002Fb> Fase 6 · Servicios sostenibles y medibles<\u002Fdiv><h2 style=\"margin-top:14px;\">Mejora Continua<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">F6<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"col-7-5\">\n        <div class=\"stack\">\n          <div class=\"panel\"><h3>¿Qué se hace y cómo?<\u002Fh3><p style=\"margin-top:12px;\">Ciclo PDCA mensual para monitorear KPIs en tiempo real, detectar desviaciones a tiempo y aplicar mejoras iterativas, manteniendo la solución en su punto óptimo y haciéndola evolucionar con la entidad.<\u002Fp><\u002Fdiv>\n          <div class=\"panel\"><h3>Productos / entregables<\u002Fh3><ul class=\"clean\" style=\"margin-top:12px;\"><li>Dashboard de KPIs de servicio al ciudadano.<\u002Fli><li>Alertas proactivas y resolución con SLA.<\u002Fli><li>Informe mensual de rendimiento.<\u002Fli><li>Backlog priorizado de mejoras.<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"svg-wrap\">\n          <div class=\"svg-label\">Ciclo PDCA<\u002Fdiv>\n          <svg viewBox=\"0 0 280 280\" role=\"img\" aria-label=\"Ciclo PDCA\">\n            <circle cx=\"140\" cy=\"140\" r=\"92\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"34\"><\u002Fcircle>\n            <circle cx=\"140\" cy=\"140\" r=\"92\" fill=\"none\" stroke=\"#2f6fe6\" stroke-width=\"34\" stroke-dasharray=\"430 580\" stroke-dashoffset=\"0\" transform=\"rotate(-90 140 140)\" stroke-linecap=\"butt\"><\u002Fcircle>\n            <g font-family=\"Space Grotesk, sans-serif\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\">\n              <text x=\"140\" y=\"58\" fill=\"#fff\">PLANIFICAR<\u002Ftext>\n              <text x=\"222\" y=\"146\" fill=\"#fff\">EJECUTAR<\u002Ftext>\n              <text x=\"140\" y=\"232\" fill=\"#0f172a\">VERIFICAR<\u002Ftext>\n              <text x=\"58\" y=\"146\" fill=\"#0f172a\">ACTUAR<\u002Ftext>\n              <text x=\"140\" y=\"136\" fill=\"#16235c\" font-size=\"14\">Mejora<\u002Ftext>\n              <text x=\"140\" y=\"156\" fill=\"#64748b\" font-size=\"11\">mensual<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"example\" style=\"margin-top:18px;\"><span class=\"tag\">▮ Ejemplo · Sector público<\u002Fspan><p><strong>Tablero de servicio al ciudadano.<\u002Fstrong> Se monitorean tiempos de respuesta de PQRS, cumplimiento de plazos legales y satisfacción; cada mes se priorizan mejoras y nuevos trámites en línea.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 13 · ROADMAP HORIZONTES -->\n  <section class=\"slide\" data-screen-label=\"07 · Hoja de ruta\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"kicker\">Priorización<\u002Fdiv><h2>Hoja de ruta por horizontes<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">05<\u002Fdiv>\n      <\u002Fheader>\n      <p class=\"lead\" style=\"max-width:74ch; margin-bottom:18px;\">Las brechas se priorizan por impacto y factibilidad y se distribuyen en tres horizontes de tiempo.<\u002Fp>\n      <div class=\"tbl-wrap\">\n        <table class=\"tbl\">\n          <thead><tr><th style=\"width:16%;\">Horizonte<\u002Fth><th style=\"width:16%;\">Plazo<\u002Fth><th style=\"width:22%;\">Foco<\u002Fth><th>Iniciativas (ejemplo público)<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>H1<\u002Ftd><td>0–6 meses<\u002Ftd><td>Quick wins y fundamentos<\u002Ftd><td>Tablero de indicadores; digitalizar el trámite de mayor volumen; comité digital.<\u002Ftd><\u002Ftr>\n            <tr><td>H2<\u002Ftd><td>6–12 meses<\u002Ftd><td>Escalar capacidades<\u002Ftd><td>Integración de datos entre secretarías; ventanilla única; equipo de analítica.<\u002Ftd><\u002Ftr>\n            <tr><td>H3<\u002Ftd><td>12+ meses<\u002Ftd><td>Innovar y consolidar<\u002Ftd><td>IA en procesos clave; KPIs ligados a metas de gobierno; modelo data-driven.<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"grid3\" style=\"margin-top:20px;\">\n        <div class=\"feature\"><div class=\"stat\"><span class=\"v\">−60 a −90%<\u002Fspan><span class=\"l\">Tiempo total de respuesta por trámite (referencial)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\"><div class=\"stat\"><span class=\"v\">24/7<\u002Fspan><span class=\"l\">El ciudadano inicia y consulta trámites en cualquier momento<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"panel\"><div class=\"stat\"><span class=\"v\">Trazable<\u002Fspan><span class=\"l\">Cada solicitud con rastro, responsable y estado visible<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 · CASO INTEGRADOR -->\n  <section class=\"slide\" data-screen-label=\"08 · Caso integrador\">\n    <div class=\"wrap\">\n      <header class=\"shead\">\n        <div><div class=\"kicker\">Caso integrador<\u002Fdiv><h2>Una alcaldía, de extremo a extremo<\u002Fh2><\u002Fdiv>\n        <div class=\"snum\">06<\u002Fdiv>\n      <\u002Fheader>\n      <div class=\"col-7-5 grow\">\n        <div class=\"stack\">\n          <div class=\"grid3\">\n            <div class=\"panel\"><div class=\"chip\">F1 → F2<\u002Fdiv><p style=\"margin-top:12px;\">El <strong>diagnóstico<\u002Fstrong> revela brechas en datos y gobernanza; se mapean PQRS y licencias.<\u002Fp><\u002Fdiv>\n            <div class=\"panel\"><div class=\"chip\">F3 → F4<\u002Fdiv><p style=\"margin-top:12px;\">Se define qué automatizar con criterio y se construye la <strong>ventanilla única<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n            <div class=\"panel\"><div class=\"chip\">F5 → F6<\u002Fdiv><p style=\"margin-top:12px;\">Se implementa con gestión del cambio y se entra en <strong>mejora continua<\u002Fstrong> con métricas mensuales.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"callout\">Las cifras son referenciales; se precisan tras el diagnóstico inicial (entrada desde 5.000 USD).<\u002Fdiv>\n        <\u002Fdiv>\n        <figure class=\"center-y\">\n          <div class=\"fig tall\"><img src=\"cc28ef4b-7c7f-4264-9abc-1631e244632d\" alt=\"Atención y servicio centrado en el ciudadano\" loading=\"lazy\" onerror=\"this.closest('.fig').classList.add('failed')\" data-comment-anchor=\"ac3dea98a5-img\"><div class=\"fb\">Servicio al ciudadano<\u002Fdiv><\u002Fdiv>\n          <figcaption>Servicios públicos digitales, trazables y centrados en el ciudadano.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 15 · CIERRE -->\n  <section class=\"slide cover\" data-screen-label=\"09 · Cierre\">\n    <div class=\"wrap center-y\" data-comment-anchor=\"7f4ed3ebfc-div\">\n      <div class=\"logo brand\" style=\"margin-bottom: 26px;\">ALGORITMO<span class=\"t\">T<\u002Fspan><\u002Fdiv>\n      <div class=\"cover-grid\">\n        <div>\n          <div class=\"kicker\" style=\"margin-bottom:18px;\">El primer paso<\u002Fdiv>\n          <h1 style=\"font-size:clamp(28px,5vw,54px);\">Leer la madurez real de la entidad<\u002Fh1>\n          <div class=\"accent\" style=\"margin:22px 0;\"><\u002Fdiv>\n          <p class=\"lead\">El punto de partida es conocer la madurez digital de la entidad, priorizar brechas y definir una hoja de ruta viable, con mejoras visibles en gestión, datos, procesos y servicio al ciudadano.<\u002Fp>\n          <div class=\"pill-row\" style=\"margin-top:26px;\"><span class=\"pill\">algoritmot.com/empresas/simulador<\u002Fspan><span class=\"pill\">hola@algoritmot.com<\u002Fspan><\u002Fdiv>\n          <div class=\"meta\" style=\"margin-top:34px;\">© 2026 AlgoritmoT · Ingeniería Humana · Despliegue IA · Madurez Orgánica<\u002Fdiv>\n        <\u002Fdiv>\n        <figure class=\"fig\">\n          <img src=\"fe1e8eb3-c8da-477d-9e60-08e1840751b6\" alt=\"Persona trabajando con tecnología — el factor humano de la transformación digital\" loading=\"lazy\" onerror=\"this.closest('.fig').classList.add('failed')\">\n          <div class=\"fb\">El factor humano de lo digital<\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<div class=\"footer\">\n  <div class=\"left\">Transformación Digital · <b>Sector Público<\u002Fb><\u002Fdiv>\n  <div class=\"nav\">\n    <button id=\"prev\" onclick=\"prev()\">‹ Anterior<\u002Fbutton>\n    <span id=\"counter\">1 / 15<\u002Fspan>\n    <button id=\"next\" class=\"primary\" onclick=\"next()\">Siguiente ›<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  const slides = Array.from(document.
